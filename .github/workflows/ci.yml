# NERV CI — 정본: docs/04-mvp/codebase.md §4.5 (REQ-CB-007 · REQ-CB-018)
#
# 워크플로 파일은 GitHub Actions 규약상 저장소 루트 .github/workflows/ 에 둔다 —
# REQ-CB-015 의 "저장소 메타 파일"에 해당하며 codebase/ 배치 원칙의 예외가 아니라 그 정의 안이다.
#
# 잡 3종은 테스트 3계층(§4.3)과 1:1 이다.
#   check       매 PR — lint · typecheck · 서식 · L1 + 스키마 드리프트 검사
#   integration 매 PR — L2(실제 Postgres). 이 코드베이스의 무게중심이다
#   e2e         merge_group + 야간 — L3(compose 스택 상대)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    # 야간 E2E (UTC 18:00 = KST 03:00)
    - cron: '0 18 * * *'

# 명령은 모노레포 루트(codebase/)에서 실행한다 — deploy/ 만 저장소 루트 기준이다(§1.1).
defaults:
  run:
    working-directory: codebase

concurrency:
  # PR 은 최신 푸시만 의미가 있으므로 취소한다. main 푸시·야간 스케줄은 **서로를 취소하면
  # 안 된다** — 연속 푸시가 앞 실행을 죽여 "그 커밋은 검증된 적 없음" 을 만든다.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (lint · typecheck · 서식 · L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 버전의 단일 정본은 .nvmrc 다 (REQ-CB-002)
          node-version-file: codebase/.nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      # **서식도 검사한다.** `format:check` 스크립트는 처음부터 있었는데 CI 가 부르지
      # 않아, 7개 파일이 이틀간 실패한 채로 그 사이 커밋들을 받았다(2026-09-02 → 09-04).
      # 아무도 몰라서가 아니라 **아무도 돌리지 않아서**다 — 돌지 않는 검사는 없는 검사다.
      - run: pnpm format:check

      # **게이트를 테스트 앞에 둔다.** 예전에는 `pnpm test` 뒤에 있었고, L1 이 실패하는 동안
      # (2026-08-26~09-02 · 21회 연속) 이 두 단계는 `if:` 없이 skipped 됐다 — 문서가 "CI 가
      # 강제한다" 고 적은 REQ-CB-007·018·010 이 **한 번도 실행된 적이 없다**는 뜻이다.
      # 순서를 바꾸면 테스트가 깨져도 드리프트는 잡힌다.
      - name: 배포 산출물 정합
        # ① 백업 스크립트 사본(k8s configMapGenerator 용)이 정본과 갈라지지 않는지
        #    — 갈라지면 운영에서 도는 절차와 문서가 달라진다
        # ② kustomize 오버레이 2종이 실제로 빌드되는지(REQ-CB-010 의 전제)
        working-directory: .
        run: |
          diff deploy/scripts/nerv-backup.sh deploy/k8s/base/backup/nerv-backup.sh
          kubectl kustomize deploy/k8s/overlays/dev > /dev/null
          kubectl kustomize deploy/k8s/overlays/prod > /dev/null

      - name: schema drift
        # REQ-CB-007 · REQ-CB-018 — 선언과 마이그레이션 산출물의 동반 강제.
        # 선언만 바꾸고 drizzle/*.sql 을 빠뜨린 PR 은 여기서 멈춘다.
        run: pnpm db:generate && git diff --exit-code -- packages/schema/drizzle

      # 테스트는 게이트 뒤다(위 주석) — 여기서 실패해도 드리프트 검사는 이미 돌았다.
      - run: pnpm test

  integration:
    name: integration (L2 · 실제 Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # compose 와 동일 이미지 (§5.3) — vector 확장이 마이그레이션에 필요하다
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      valkey:
        # L2 는 방송 규약(REQ-CB-004)도 검증한다 — 커밋 후 PUBLISH 순서는 mock 으로 확인되지 않는다
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/.nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # **서버와 짝이 맞는 클라이언트.** 러너 기본은 pg16 이고 서비스는 pg17 이라
      # `pg_dump` 가 "server version mismatch" 로 즉시 죽었다 — 백업 왕복(REQ-CB-019)이
      # CI 에서 한 번도 통과한 적이 없었던 이유다(2026-09-02 실측).
      - name: PostgreSQL 17 클라이언트
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      # migrate 는 빌드 산출물(dist/migrate.js)을 쓴다 — compose·k8s 와 같은 코드 경로다
      - run: pnpm build
      - run: pnpm db:migrate && pnpm test:integration
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
          NERV_VALKEY_URL: redis://localhost:6379

  e2e:
    name: e2e (L3 · compose 스택)
    # PR 마다 돌리지 않는다 — merge_group 과 야간 스케줄에서만(§4.3)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/.nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # **호스트 빌드가 필요하다.** L3 스위트는 `@nerv/schema`·`@nerv/schema/migrate` 를
      # import 하고 그 exports 는 dist/ 만 가리킨다. `e2e:up` 의 docker build 는 컨테이너
      # 안에서만 빌드하므로 호스트 dist 는 생기지 않는다 — 이 단계가 없는 동안 시나리오
      # A~E 는 첫 import 에서 죽었고, 그래서 **한 번도 판정된 적이 없다**(2026-09-02).
      - run: pnpm build
      - name: E2E 스택 기동
        # **개발 스택이 아니라 E2E 전용 스택이다**(deploy/compose/docker-compose.e2e.yml).
        # `.env` 를 요구하지 않고, 저장소는 tmpfs 라 매 실행이 빈 DB 에서 시작하며,
        # `--wait` 가 마이그레이션·시드 완료까지 기다린다(§4.3).
        # local-embed 프로필은 아예 없다 — 검색은 렉시컬 degrade 경로로 검증한다(REQ-API-026).
        run: pnpm e2e:up

      - name: 브라우저 설치
        # L3 웹은 실제 브라우저다 — 없으면 시나리오 D 의 절반이 조용히 건너뛰어진다
        run: pnpm --filter @nerv/web exec playwright install --with-deps chromium
      - name: E2E (API 시나리오 A~E + 웹 브라우저)
        # 대상 주소는 스크립트가 E2E 스택으로 고정한다 — 여기서 env 를 다시 주면
        # CI 와 로컬이 다른 것을 향해 돌 여지가 생긴다.
        run: pnpm test:e2e
      - name: E2E 스택 로그 (실패 시)
        if: failure()
        run: pnpm e2e:logs
      - name: E2E 스택 정리
        if: always()
        run: pnpm e2e:down
