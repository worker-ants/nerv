# NERV CI — 정본: docs/04-mvp/codebase.md §4.5 (REQ-CB-007 · REQ-CB-018)
#
# 워크플로 파일은 GitHub Actions 규약상 저장소 루트 .github/workflows/ 에 둔다 —
# REQ-CB-015 의 "저장소 메타 파일"에 해당하며 codebase/ 배치 원칙의 예외가 아니라 그 정의 안이다.
#
# 잡 3종은 테스트 3계층(§4.3)과 1:1 이다.
#   check       매 PR — lint · typecheck · 서식 · 게이트 여섯 · L1
#   integration 매 PR — L2(실제 Postgres). 이 코드베이스의 무게중심이다
#   e2e         매 PR + merge_group + 야간 — L3(compose 스택 상대)
#
# **셋 다 머지 전에 돈다**(2026-09-06 개정). e2e 는 오래 `merge_group + 야간` 뿐이었고,
# 그래서 L3 파손이 **머지된 뒤에야** 드러났다 — 실제로 그렇게 됐다: PR #1 은 두 잡이 초록,
# 로컬 `pnpm preflight` 도 초록이었는데 머지 커밋의 e2e 가 빨갰다. 규약 7 이 적은
# "로컬 초록이 CI 초록을 뜻하지 않는다" 의 그 자리인데 원인이 속도가 아니라 **레인**이었다.
# 그 빨강은 다음 사람에게 배경이 된다 — 그러라고 세운 검사가 아니다.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:                 # 머지 전 레인 — 세 잡 모두. e2e 는 PR 에서도 돈다(2026-09-06)
  schedule:
    # 야간 E2E (UTC 18:00 = KST 03:00)
    - cron: '0 18 * * *'

# 명령은 모노레포 루트(codebase/)에서 실행한다 — deploy/ 만 저장소 루트 기준이다(§1.1).
defaults:
  run:
    working-directory: codebase

concurrency:
  # PR 은 최신 푸시만 의미가 있으므로 취소한다. main 푸시·야간 스케줄은 **서로를 취소하면
  # 안 된다** — 연속 푸시가 앞 실행을 죽여 "그 커밋은 검증된 적 없음" 을 만든다.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (lint · typecheck · 서식 · L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 플러그인 버전 게이트가 base 와 견주므로 얕은 클론으로는 부족하다
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Node 버전의 단일 정본은 .nvmrc 다 (REQ-CB-002)
          node-version-file: codebase/.nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      # **서식도 검사한다.** `format:check` 스크립트는 처음부터 있었는데 CI 가 부르지
      # 않아, 7개 파일이 이틀간 실패한 채로 그 사이 커밋들을 받았다(2026-09-02 → 09-04).
      # 아무도 몰라서가 아니라 **아무도 돌리지 않아서**다 — 돌지 않는 검사는 없는 검사다.
      - run: pnpm format:check

      # **버전이 곧 배달이다**(REQ-PLG-017). 설치된 플러그인은 `plugin.json` 의 version 이
      # 오를 때만 새 사본을 받는다 — 스킬을 고치고 버전을 그대로 두면 이미 설치한 쪽은
      # 오류도 경고도 없이 옛 판을 계속 읽는다. 2026-09-04 에 실제로 그렇게 됐다: 첨부
      # 되읽기 절을 넣었는데 설치본에는 그 문장이 **한 번도 나오지 않았다**(실사용 보고).
      - name: 플러그인 버전 게이트
        # PR 은 base 와, main 푸시는 직전 커밋과 견준다. 그 밖(merge_group·schedule)에서는
        # 비교 대상이 없어 스크립트가 스스로 통과한다 — 비교 대상이 없으면 판정도 없다.
        run: node scripts/check-plugin-version.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

      # **게이트를 테스트 앞에 둔다.** 예전에는 `pnpm test` 뒤에 있었고, L1 이 실패하는 동안
      # (2026-08-26~09-02 · 21회 연속) 이 두 단계는 `if:` 없이 skipped 됐다 — 문서가 "CI 가
      # 강제한다" 고 적은 REQ-CB-007·018·010 이 **한 번도 실행된 적이 없다**는 뜻이다.
      # 순서를 바꾸면 테스트가 깨져도 드리프트는 잡힌다.
      - name: 배포 산출물 정합
        # ① 백업 스크립트 사본(k8s configMapGenerator 용)이 정본과 갈라지지 않는지
        #    — 갈라지면 운영에서 도는 절차와 문서가 달라진다
        # ② kustomize 오버레이 2종이 실제로 빌드되는지(REQ-CB-010 의 전제)
        working-directory: .
        run: |
          diff deploy/scripts/nerv-backup.sh deploy/k8s/base/backup/nerv-backup.sh
          kubectl kustomize deploy/k8s/overlays/dev > /dev/null
          kubectl kustomize deploy/k8s/overlays/prod > /dev/null

      # **백로그가 저장소를 설명하는가**(AGENTS.md 문서 작업 규약 6 · REQ-CB-029).
      # 4.8 §1.4 의 현황 표가 실제 스토리와 어긋나면 막는다 — 그 문서는 첫 임포트 대상이라
      # 틀린 상태가 그대로 Task 의 초기 상태가 된다. 2026-08-22~09-06 에 "모든 스토리는
      # 현재 backlog 다" 가 74개 중 73개에 대해 거짓인 채로 남아 있었다.
      - name: 백로그 현황 정합
        run: node scripts/check-backlog-status.mjs

      # **md 가 원본이고 html 은 파생본이다**(docs/README.md 관리 규약 1). 그 규약은
      # 2026-09-06 까지 사람 규율뿐이었고, 그래서 어긋났다 — v2.40 이 여덟 자리를 손으로
      # 고쳤고(버전 줄만 고치고 절·표·DDL 을 빠뜨린 커밋이 열한 개였다), v0.82 는 파생본의
      # 전표에서 네 행이 통째로 빠져 **같은 문서 안의 참조가 죽어 있던** 것을 고쳤다.
      # 세는 것은 넷이다: 파일 짝 · 버전(목차의 버전 열 포함) · 절 번호 · 본문의 고정 ID.
      - name: md ↔ html 정합
        run: node scripts/check-md-html.mjs

      # **전표가 소비자를 적으면 그것이 계약이다**(4.2 §5.2). `NERV_LOG_LEVEL` 은 소비자를
      # "api · worker" 라 적어 두고 읽는 코드가 **0건**이었다 — 운영자가 값을 바꿔도 아무 일이
      # 일어나지 않는 유령 설정이다. 반대 방향(코드가 읽는데 전표에 없다)도 함께 본다.
      - name: .env 전표 정합
        run: node scripts/check-env-table.mjs

      # **문서가 늘수록 문서 간 정합이 먼저 깨진다**(AGENTS.md 문서 작업 규약 7 · REQ-CB-030).
      # 링크 없는 번호 인용("4.4 §1.6")은 도구가 따라갈 수 없어 깨져도 아무도 모르고, 사람이
      # 적는 역참조 목록은 첫날부터 낡는다. 세는 것은 넷이다: 죽은 링크(md 링크 · html href·앵커) ·
      # frontmatter `referenced_by`(링크에서 계산한 역참조와 같은가) · 파생본 머리의 같은 줄 · 맨 참조.
      - name: 문서 간 참조
        run: node scripts/check-doc-links.mjs

      - name: schema drift
        # REQ-CB-007 · REQ-CB-018 — 선언과 마이그레이션 산출물의 동반 강제.
        # 선언만 바꾸고 drizzle/*.sql 을 빠뜨린 PR 은 여기서 멈춘다.
        run: pnpm db:generate && git diff --exit-code -- packages/schema/drizzle

      # 테스트는 게이트 뒤다(위 주석) — 여기서 실패해도 드리프트 검사는 이미 돌았다.
      #
      # **md 왕복 스파이크는 레인이 둘이다**(roundtrip-spike.spec.ts).
      # 그 검사는 `docs/**/*.md` 전수를 각각 두 번 왕복해 **문서가 늘면 그만큼 느려진다** —
      # 고정 상한 30초를 다섯 번 넘겨 main 을 빨갛게 만들었다(2026-09-05~06).
      # 전수는 **머지 전에 보는 레인**(pull_request · merge_group)과 야간에서만 돌리고,
      # main 푸시 레인은 등간격 표본 6편만 본다. 상한은 표본 수에 비례해 계산된다.
      - run: pnpm test
        env:
          NERV_ROUNDTRIP_FULL: ${{ (github.event_name == 'push' && '0') || '1' }}

  integration:
    name: integration (L2 · 실제 Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # compose 와 동일 이미지 (§5.3) — vector 확장이 마이그레이션에 필요하다
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      valkey:
        # L2 는 방송 규약(REQ-CB-004)도 검증한다 — 커밋 후 PUBLISH 순서는 mock 으로 확인되지 않는다
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/.nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # **서버와 짝이 맞는 클라이언트.** 러너 기본 클라이언트는 서비스 이미지보다 낮고,
      # `pg_dump` 는 자기보다 새 메이저의 서버를 거부한다("server version mismatch") —
      # 백업 왕복(REQ-CB-019)이 CI 에서 한 번도 통과한 적이 없었던 이유다(2026-09-02 실측).
      #
      # **이 줄은 서비스 이미지와 함께 올린다.** 낮은 채로 두면 실패가 아니라 조용한 skip 이 된다
      # (restore-roundtrip.spec.ts 의 `describe.skipIf`) — 초록인데 REQ-CB-019 를 아무도
      # 검증하지 않는 상태다. 건너뛰기는 로컬 장비를 위한 것이지 CI 의 면제가 아니다.
      - name: PostgreSQL 18 클라이언트
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      # migrate 는 빌드 산출물(dist/migrate.js)을 쓴다 — compose·k8s 와 같은 코드 경로다
      - run: pnpm build
      - run: pnpm db:migrate && pnpm test:integration
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
          NERV_VALKEY_URL: redis://localhost:6379

  e2e:
    name: e2e (L3 · compose 스택)
    # **매 PR 에서도 돈다**(2026-09-06 개정 · §4.3). 예전에는 `merge_group` 과 야간에서만
    # 돌았고, 그래서 이 잡이 잡는 부류의 파손은 **머지된 뒤에만** 드러났다.
    #
    # 비용은 **5m31s** 다(2026-09-06 PR #5 실측 — 테스트 자체는 3분 남짓이고 나머지는
    # 체크아웃·`pnpm install`·`pnpm build`·docker build·브라우저 설치다). 세 잡이 병렬이라
    # PR 전체 대기 시간이 1m27s → 5m31s 로 늘어난다. PR 은 `cancel-in-progress` 라
    # 재푸시가 쌓이지는 않는다.
    #
    # 드래프트를 건너뛰지 않는 것도 의도다 — 건너뛰려면 `ready_for_review` 를 트리거에 더해야 하고,
    # 잊으면 "드래프트를 ready 로 바꿨는데 한 번도 안 돈" 상태가 생긴다. 지금 고치는 결함이
    # 정확히 그 모양이다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/.nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # **호스트 빌드가 필요하다.** L3 스위트는 `@nerv/schema`·`@nerv/schema/migrate` 를
      # import 하고 그 exports 는 dist/ 만 가리킨다. `e2e:up` 의 docker build 는 컨테이너
      # 안에서만 빌드하므로 호스트 dist 는 생기지 않는다 — 이 단계가 없는 동안 시나리오
      # A~E 는 첫 import 에서 죽었고, 그래서 **한 번도 판정된 적이 없다**(2026-09-02).
      - run: pnpm build
      - name: E2E 스택 기동
        # **개발 스택이 아니라 E2E 전용 스택이다**(deploy/compose/docker-compose.e2e.yml).
        # `.env` 를 요구하지 않고, 저장소는 tmpfs 라 매 실행이 빈 DB 에서 시작하며,
        # `--wait` 가 마이그레이션·시드 완료까지 기다린다(§4.3).
        # local-embed 프로필은 아예 없다 — 검색은 렉시컬 degrade 경로로 검증한다(REQ-API-026).
        run: pnpm e2e:up

      - name: 브라우저 설치
        # L3 웹은 실제 브라우저다 — 없으면 시나리오 D 의 절반이 조용히 건너뛰어진다
        run: pnpm --filter @nerv/web exec playwright install --with-deps chromium
      - name: E2E (API 시나리오 A~E + 웹 브라우저)
        # 대상 주소는 스크립트가 E2E 스택으로 고정한다 — 여기서 env 를 다시 주면
        # CI 와 로컬이 다른 것을 향해 돌 여지가 생긴다.
        run: pnpm test:e2e
      - name: E2E 스택 로그 (실패 시)
        if: failure()
        run: pnpm e2e:logs
      - name: E2E 스택 정리
        if: always()
        run: pnpm e2e:down

  # 외부 URL 생존 — 근거 규율("접속 확인된 것만 싣는다")은 실을 때 한 번만 지켜지고 그 뒤 죽은
  # URL 은 근거로 남는다. 야간 레인에서만 돈다: 네트워크 흔들림을 PR 레인에 두면 "원래 나던
  # 빨강" 이 된다(구현 규약 7). 설정은 저장소 루트 lychee.toml.
  link-check:
    name: 외부 URL 생존 (야간)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress 'docs/**/*.md' README.md AGENTS.md
          fail: true
