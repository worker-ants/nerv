# <repo>/.codex/config.toml — Codex 세션용 NERV 접속 초안
#
# **이 파일은 템플릿이다.** 쓰는 저장소의 `.codex/config.toml` 로 복사하고 두 곳을
# 자기 값으로 바꾼다: `url` · `X-NERV-Project`.
# 자동 생성·갱신은 Phase 2 다(4.6 §5.1) — MVP 의 약속은 이 초안을 손으로 두는 경로다.
#
# 정본: docs/04-mvp/plugin.md §5.2
#
# 최상위 키는 표 이름([…]) **앞에** 둔다 — 뒤에 두면 그 표의 키가 되어 Codex 가 무시한다(2026-10-16 실측).

# 사람 승인 레인 — A3 도구는 승인 없이 실행되지 않는다
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.nerv]
url = "https://api.nerv.example.com/mcp"
bearer_token_env_var = "NERV_TOKEN"
http_headers = { "X-NERV-Project" = "clemvion" }
startup_timeout_sec = 20
# hostname 은 nerv_bootstrap 인자로 전달한다(헤더 확장에 의존하지 않는다)

# ── 사용자 설정(~/.codex/config.toml)에만 둘 수 있는 것 ─────────────────────────
# Codex 는 저장소 설정의 notify · [otel] 을 무시한다(2026-10-16 실측). 쓰려면 아래를
# 사용자 설정으로 옮겨 주석을 푼다. notify 는 사용자 설정의 표 이름 앞에 둔다.
#
# 턴 완료 알림 → NERV Ingest(/ingest/hooks/notify · 4.6 §5.2). Codex 에 설치한 NERV
# 플러그인의 포워더를 부른다 — 설치 캐시 경로에 버전이 들어 있어 셸이 찾고, 플러그인이
# 없으면 아무것도 하지 않는다. Codex 는 알림 JSON 을 마지막 인자($1)로 붙인다. 포워더는
# 그 세션 저장소의 .nerv/env 와 셸 환경(NERV_SERVER · NERV_PROJECT · NERV_TOKEN)을 읽는다.
# 사용자 설정이라 모든 저장소의 턴에 불리지만, 포워더는 NERV 를 설정한 저장소(.nerv/env · 저장소
# .codex/config.toml 의 [mcp_servers.nerv] · .mcp.json 의 nerv)의 턴만 보낸다(4.6 §5.2 · REQ-PLG-038).
# notify = ["sh", "-c", 'for f in "${CODEX_HOME:-$HOME/.codex}"/plugins/cache/*/nerv/*/bin/nerv-hook-forward; do [ -x "$f" ] && exec "$f" --event notify "$1"; done; exit 0', "nerv-notify"]
