# 배포 절차상 Deployment 롤아웃 완료 판정보다 먼저 성공해야 한다(REQ-CB-010).
# Job 은 불변 리소스라 재적용 전 삭제한다 — 절차 전문은 docs/04-mvp/codebase.md §6.3.
apiVersion: batch/v1
kind: Job
metadata:
  name: nerv-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: nerv-api # 같은 이미지 — compose migrate 서비스와 동일 엔트리
          command: ['node', 'dist/migrate.js']
          envFrom:
            - secretRef: { name: nerv-secrets }
