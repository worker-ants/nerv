# deploy/compose/docker-compose.yml   ← 저장소 루트 기준 (REQ-CB-015, 2026-08-22 개정)
# NERV 로컬 개발 · 소규모 자가호스팅 정본 (NFR-01).
# 실행: 모노레포 루트(codebase/)에서 — .env 가 거기 있고 pnpm 래퍼도 거기서 돈다
#   docker compose -f ../deploy/compose/docker-compose.yml --env-file .env up -d --build
# (래퍼: pnpm compose:up — docs/04-mvp/codebase.md §5.1)
# 빌드 컨텍스트는 저장소 루트다 — 이 파일 기준 ../.. (codebase/ 소스와 deploy/docker/nginx/
# 템플릿을 한 컨텍스트에서 본다). 제외는 저장소 루트 .dockerignore.
# 운영 k8s 는 deploy/k8s (§6). 같은 이미지 3종(nerv-api·nerv-worker·nerv-web)을 두 타깃이 공유한다.
name: nerv

services:
  postgres:
    image: pgvector/pgvector:pg18    # postgres:18 + pgvector 동봉 (4.3 §2.1 확장 — 4.1 §2.1 검색 스택)
    restart: unless-stopped
    environment:
      # **pg18 이미지는 데이터 경로를 옮겼다** — PGDATA 가 메이저별 하위 디렉터리
      # (/var/lib/postgresql/18/docker)로 가고 선언 볼륨도 상위(/var/lib/postgresql)로 올라갔다.
      # 아래 마운트를 그대로 두고 이 줄을 빼면 **빈 볼륨이어도** 기동이 거부된다
      # ("there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused mount/volume)").
      # 옛 경로를 명시해 마운트를 유지한다 — 볼륨 이름과 백업 절차가 그대로 성립한다.
      #
      # 옛 pg17 볼륨이 남아 있으면 `FATAL: database files are incompatible with server` 로
      # **시끄럽게** 죽는다(데이터는 그대로 남는다). 개발 볼륨은 버리고 다시 만든다:
      #   pnpm compose:down && docker volume rm nerv_pgdata && pnpm compose:up
      # 살릴 데이터가 있으면 pg17 에서 `pg_dump -Fc` 를 떠 pg18 에 복원한다(deploy/scripts).
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-nerv}
      POSTGRES_USER: ${POSTGRES_USER:-nerv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # 개발 루프용 — 운영 배포에서는 제거
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nerv} -d $${POSTGRES_DB:-nerv}"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:                            # 실시간 방송 MQ — nerv_events pub/sub (§2.1, 4.3 §3)
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]   # pub/sub 전용 — 무영속(유실 허용, 진실은 DB — D-14)
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"    # 개발 루프용 — 운영 배포에서는 제거
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6

  mailpit:                           # 개발용 SMTP 받이 — 나간 메일을 잡아 웹으로 보여 준다
    # **보내는 것과 받는 것을 한 기계에서 본다.** 메일은 "보냈다" 까지만 확인하면 절반이고,
    # 실제로 어떤 글자가 도착했는지는 받아 봐야 안다 — 이 저장소가 스크린샷에서 배운 것과
    # 같은 이유다. 운영에는 없다(compose 전용 · k8s 산출물에 대응물이 없는 유일한 서비스다).
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"     # 개발 받이다 — 인증을 흉내 내지 않는다
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # 받은 편지함
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  embed:                             # 로컬 프로필 전용 임베딩 서빙(OpenAI 호환 /v1/embeddings 노출).
    profiles: ["local-embed"]        #   외부 제공자(LM Studio·OpenAI) 프로필에서는 기동하지 않는다 (§5.2a)
    # 이미지가 ollama 인 이유는 **개발자의 기계에서 도는 것**이 이 프로필의 존재 이유이기
    # 때문이다. TEI(ghcr.io/huggingface/text-embeddings-inference)는 arm64 이미지를 내지
    # 않아 Apple Silicon 에서 `no matching manifest` 로 멈춘다(실측 2026-08-23 — 전 태그 확인).
    # amd64 에뮬레이션은 기동은 하지만 워밍업에서 OOM 으로 죽는다(exit 137).
    # ollama 는 amd64·arm64 둘 다 내고, 같은 bge-m3(F16 · 1024차원)를 같은 계약으로 노출한다.
    image: ollama/ollama:latest      # 버전 태그 고정 권장
    restart: unless-stopped
    # ollama 는 요청 시 모델을 자동으로 받지 않는다(실측: `model not found, try pulling it first`).
    # 서버를 띄운 뒤 한 번 받아 두지 않으면 첫 검색이 조용히 렉시컬로 degrade 한다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "${NERV_EMBED_MODEL:-bge-m3}"
        wait
    volumes:
      - embedmodels:/root/.ollama    # 모델 가중치 캐시 — 첫 기동만 다운로드
    ports:
      - "127.0.0.1:${NERV_EMBED_PORT:-8090}:11434"   # 개발 루프용 — 운영 배포에서는 제거
    healthcheck:
      # **모델이 실제로 응답할 때만** healthy 다 — 서버만 떠 있는 상태를 준비됐다고 부르면
      # 그 사이의 임베딩이 전부 조용히 실패한다
      test:
        - CMD-SHELL
        - >
          ollama list 2>/dev/null | grep -q "${NERV_EMBED_MODEL:-bge-m3}"
      interval: 10s
      timeout: 5s
      retries: 60                    # 첫 기동은 모델(~1.2GB) 다운로드를 기다린다
    # api·worker 는 embed 를 기다리지 않는다 — 무응답이면 렉시컬 degrade (REQ-API-026)

  minio:
    # 도커허브의 minio/minio 는 2026-09-11 부터 당길 수 없다("pull access denied …
    # repository does not exist") — 저장소는 그대로인데 레지스트리가 바뀌어 09-10 초록이던
    # 커밋이 09-11 야간부터 빨갛다. quay.io 로 옮긴다: 같은 저장소의 백업 CronJob 이
    # 이미 quay.io/minio/mc 를 쓰고 있었고, 여기만 도커허브에 남아 있었다.
    # **`latest` 로 되돌리지 않는다** — 남의 레지스트리의 움직이는 태그는 우리 저장소를
    # 건드리지 않고도 과거 커밋의 빌드까지 소급해 깨뜨린다. 그것이 이번에 일어난 일이다.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nerv}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"      # 개발 루프용 S3 엔드포인트
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:                           # 기동 시 마이그레이션 — k8s 의 nerv-migrate Job 과 같은 엔트리 (§6.3)
    image: nerv-api:${NERV_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
      target: api
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nerv}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerv}
    depends_on:
      postgres:
        condition: service_healthy

  api:                               # nerv-api — REST + MCP + WebSocket + SSE + ingest (§2)
    image: nerv-api:${NERV_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NERV_API_PORT: ${NERV_API_PORT:-8080}
      # 걷힌 이름 둘을 **넘겨 준다** — compose 는 모르는 변수를 조용히 무시하므로, 넘기지
      # 않으면 옛 이름을 둔 배치가 아무 말 없이 기본값으로 뜨고 약속한 거부가 유령이 된다
      # (REQ-CB-037 · 039). 값이 없는 배치에서는 빈 문자열로 와서 아무 일도 하지 않는다.
      NERV_PUBLIC_URL: ${NERV_PUBLIC_URL:-}
      NERV_HTTP_PORT: ${NERV_HTTP_PORT:-}
      # 우리 주소는 둘이다(§5.2 · REQ-CB-036) — 앞문 하나가 화면과 API 를 함께 서빙하므로
      # compose 에서는 같은 값이다. 옛 이름(NERV_PUBLIC_URL)만 있으면 api 가 기동을 거부한다.
      NERV_WEB_URL: ${NERV_WEB_URL:-http://localhost:8080}
      NERV_API_URL: ${NERV_API_URL:-http://localhost:8080}
      # 허용 오리진 추가분과 세션 쿠키의 Domain — 앞문 하나인 compose 에서는 보통 둘 다
      # 비어 있다(REQ-CB-041 · 042). **그래도 넘긴다**: compose 는 env 를 키 목록으로
      # 넘기므로, 여기 없으면 `.env` 에 적어도 컨테이너에 닿지 않는다 — 손잡이가 있는데
      # 아무 배치에서도 듣지 않던 자리와 같은 부류다(REQ-CB-038).
      NERV_TRUSTED_ORIGINS: ${NERV_TRUSTED_ORIGINS:-}
      NERV_COOKIE_DOMAIN: ${NERV_COOKIE_DOMAIN:-}
      # 클라이언트 주소(REQ-CB-055) — 신뢰 프록시는 비면 loopback·사설 대역이다. 헤더는 비면
      # 믿지 않는다. Cloudflare Tunnel 뒤라면 cf-connecting-ip 를 적는다(§5.5 배치 요건).
      NERV_TRUSTED_PROXIES: ${NERV_TRUSTED_PROXIES:-}
      NERV_CLIENT_IP_HEADER: ${NERV_CLIENT_IP_HEADER:-}
      NERV_AUTH_SECRET: ${NERV_AUTH_SECRET:?set NERV_AUTH_SECRET in .env}
      NERV_LOG_LEVEL: ${NERV_LOG_LEVEL:-info}
      NERV_LOG_FORMAT: ${NERV_LOG_FORMAT:-json}   # 컨테이너는 수집기가 읽는다 — 한 줄에 JSON 하나 (§5.5)
      DATABASE_URL: postgres://${POSTGRES_USER:-nerv}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerv}
      NERV_VALKEY_URL: redis://valkey:6379
      NERV_EMBED_URL: ${NERV_EMBED_URL:-http://embed:11434/v1}   # 프로필 §5.2a — 외부 제공자 시 .env 로 교체
      NERV_EMBED_MODEL: ${NERV_EMBED_MODEL:-bge-m3}
      NERV_EMBED_API_KEY: ${NERV_EMBED_API_KEY:-}
      # 요청에 dimensions 를 실을 것인가 — 호스트로 추정하지 않는다(§5.2a · REQ-CB-033)
      NERV_EMBED_SEND_DIMENSIONS: ${NERV_EMBED_SEND_DIMENSIONS:-false}
      NERV_EMBED_TRUNCATE: ${NERV_EMBED_TRUNCATE:-false}
      NERV_S3_ENDPOINT: http://minio:9000
      # 에이전트가 받는 서명 주소는 밖에서 열려야 한다 — 기본은 호스트에서 열리는 minio 포트다.
      # 밖에서 쓰려면 **별도 호스트**로 바꾼다(경로 접두는 서명이 깨진다 — REQ-CB-033).
      NERV_S3_PUBLIC_ENDPOINT: ${NERV_S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      NERV_GITHUB_WEBHOOK_SECRET: ${NERV_GITHUB_WEBHOOK_SECRET:-}
      NERV_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nerv}
      NERV_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      NERV_S3_BUCKET: ${NERV_S3_BUCKET:-nerv-blobs}
      NERV_S3_FORCE_PATH_STYLE: "true"
      # 메일 — 호스트가 비면 보내지 않는다(2026-09-22). 기본이 아래 mailpit 이라 개발 루프에서
      # 초대 메일이 실제로 나가고, 받은 편지함은 http://localhost:8025 에서 본다.
      # 접속 정보 다섯(2026-09-24) — mailpit 은 인증을 요구하지 않아 USER·PASS 가 빈다.
      NERV_MAIL_HOST: ${NERV_MAIL_HOST:-mailpit}
      NERV_MAIL_PORT: ${NERV_MAIL_PORT:-1025}
      # 비우면 포트에서 유도한다(465 면 true) — mailpit 은 평문이라 false 다.
      NERV_MAIL_SECURE: ${NERV_MAIL_SECURE:-}
      NERV_MAIL_USER: ${NERV_MAIL_USER:-}
      NERV_MAIL_PASS: ${NERV_MAIL_PASS:-}
      # 걷힌 이름을 **넘겨 준다** — compose 는 모르는 변수를 조용히 무시하므로, 넘기지 않으면
      # URL 을 둔 배치가 아무 말 없이 메일이 꺼진 채로 뜨고 약속한 거부가 유령이 된다
      # (REQ-CB-050). 값이 없는 배치에서는 빈 문자열로 와서 아무 일도 하지 않는다.
      NERV_SMTP_URL: ${NERV_SMTP_URL:-}
      NERV_MAIL_FROM: ${NERV_MAIL_FROM:-NERV <no-reply@nerv.example.com>}
      NERV_MAIL_REPLY_TO: ${NERV_MAIL_REPLY_TO:-}
      NERV_MAIL_DRY_RUN: ${NERV_MAIL_DRY_RUN:-false}
      NERV_REQUIRE_EMAIL_VERIFICATION: ${NERV_REQUIRE_EMAIL_VERIFICATION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${NERV_API_PORT:-8080}/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:                            # nerv-worker — 같은 코드베이스, 엔트리 분리. replica 1 고정 (§6.3)
    image: nerv-worker:${NERV_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # **워커도 인증 키를 받는다.** AuthModule 이 워커 그래프에 있어(task·session·event·spec)
      # `AuthService` 가 생성자에서 better-auth 를 만든다 — 키가 없으면 개발용 기본 키로
      # 떨어지고, api 와 worker 가 **서로 다른 서명 키**를 들고 돈다. k8s 는 `envFrom` 으로
      # 워커도 받으므로 compose 만 다른 모양이었다(2026-09-14).
      NERV_AUTH_SECRET: ${NERV_AUTH_SECRET:?set NERV_AUTH_SECRET in .env}
      # 공개 주소 둘 — 워커가 만드는 응답에 딥링크가 실릴 수 있고, 걷힌 이름 판정의
      # "새 이름이 있는가" 도 이 값들을 본다(REQ-CB-036 · 037).
      NERV_WEB_URL: ${NERV_WEB_URL:-http://localhost:8080}
      NERV_API_URL: ${NERV_API_URL:-http://localhost:8080}
      # api 와 **같은 값으로** 넘긴다 — 워커도 `AuthService` 를 그래프에 갖고 그 생성자가
      # 쿠키 도메인을 검증한다. 한쪽만 받으면 절반만 거부하는 배포가 된다(REQ-CB-042).
      NERV_TRUSTED_ORIGINS: ${NERV_TRUSTED_ORIGINS:-}
      NERV_COOKIE_DOMAIN: ${NERV_COOKIE_DOMAIN:-}
      # 걷힌 이름 둘을 **넘겨 준다** — compose 는 모르는 변수를 조용히 무시하므로, 넘기지
      # 않으면 옛 이름을 둔 배치가 아무 말 없이 기본값으로 뜨고 약속한 거부가 유령이 된다
      # (REQ-CB-037 · 039). 값이 없는 배치에서는 빈 문자열로 와서 아무 일도 하지 않는다.
      NERV_PUBLIC_URL: ${NERV_PUBLIC_URL:-}
      NERV_HTTP_PORT: ${NERV_HTTP_PORT:-}
      NERV_LOG_LEVEL: ${NERV_LOG_LEVEL:-info}
      NERV_LOG_FORMAT: ${NERV_LOG_FORMAT:-json}   # 컨테이너는 수집기가 읽는다 — 한 줄에 JSON 하나 (§5.5)
      DATABASE_URL: postgres://${POSTGRES_USER:-nerv}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerv}
      NERV_VALKEY_URL: redis://valkey:6379
      NERV_EMBED_URL: ${NERV_EMBED_URL:-http://embed:11434/v1}   # 프로필 §5.2a — 외부 제공자 시 .env 로 교체
      NERV_EMBED_MODEL: ${NERV_EMBED_MODEL:-bge-m3}
      NERV_EMBED_API_KEY: ${NERV_EMBED_API_KEY:-}
      # 요청에 dimensions 를 실을 것인가 — 호스트로 추정하지 않는다(§5.2a · REQ-CB-033)
      NERV_EMBED_SEND_DIMENSIONS: ${NERV_EMBED_SEND_DIMENSIONS:-false}
      NERV_EMBED_TRUNCATE: ${NERV_EMBED_TRUNCATE:-false}
      NERV_S3_ENDPOINT: http://minio:9000
      # 에이전트가 받는 서명 주소는 밖에서 열려야 한다 — 기본은 호스트에서 열리는 minio 포트다.
      # 밖에서 쓰려면 **별도 호스트**로 바꾼다(경로 접두는 서명이 깨진다 — REQ-CB-033).
      NERV_S3_PUBLIC_ENDPOINT: ${NERV_S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      NERV_GITHUB_WEBHOOK_SECRET: ${NERV_GITHUB_WEBHOOK_SECRET:-}
      NERV_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nerv}
      NERV_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      NERV_S3_BUCKET: ${NERV_S3_BUCKET:-nerv-blobs}
      NERV_S3_FORCE_PATH_STYLE: "true"
      # 메일 — 호스트가 비면 보내지 않는다(2026-09-22). 기본이 아래 mailpit 이라 개발 루프에서
      # 초대 메일이 실제로 나가고, 받은 편지함은 http://localhost:8025 에서 본다.
      # 접속 정보 다섯(2026-09-24) — mailpit 은 인증을 요구하지 않아 USER·PASS 가 빈다.
      NERV_MAIL_HOST: ${NERV_MAIL_HOST:-mailpit}
      NERV_MAIL_PORT: ${NERV_MAIL_PORT:-1025}
      # 비우면 포트에서 유도한다(465 면 true) — mailpit 은 평문이라 false 다.
      NERV_MAIL_SECURE: ${NERV_MAIL_SECURE:-}
      NERV_MAIL_USER: ${NERV_MAIL_USER:-}
      NERV_MAIL_PASS: ${NERV_MAIL_PASS:-}
      # 걷힌 이름을 **넘겨 준다** — compose 는 모르는 변수를 조용히 무시하므로, 넘기지 않으면
      # URL 을 둔 배치가 아무 말 없이 메일이 꺼진 채로 뜨고 약속한 거부가 유령이 된다
      # (REQ-CB-050). 값이 없는 배치에서는 빈 문자열로 와서 아무 일도 하지 않는다.
      NERV_SMTP_URL: ${NERV_SMTP_URL:-}
      NERV_MAIL_FROM: ${NERV_MAIL_FROM:-NERV <no-reply@nerv.example.com>}
      NERV_MAIL_REPLY_TO: ${NERV_MAIL_REPLY_TO:-}
      NERV_MAIL_DRY_RUN: ${NERV_MAIL_DRY_RUN:-false}
      NERV_REQUIRE_EMAIL_VERIFICATION: ${NERV_REQUIRE_EMAIL_VERIFICATION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web:                               # nerv-web — Vite 산출물 + nginx reverse-proxy (§5.4)
    image: nerv-web:${NERV_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NERV_API_UPSTREAM: api:${NERV_API_PORT:-8080}
      # 앞문이 자기 오리진으로 /mcp Origin 을 1차 검증한다 — 브라우저가 싣는 Origin 은
      # 화면이 뜬 주소이므로 NERV_WEB_URL 이다. 최종 강제는 앱 가드이고 그쪽은 둘 다 허용한다.
      NERV_PUBLIC_ORIGIN: ${NERV_WEB_URL:-http://localhost:8080}
      # 앞문이 리슨하는 포트 — 템플릿의 `listen` 이 이 값으로 치환된다(REQ-CB-038)
      NERV_WEB_PORT: ${NERV_WEB_PORT:-8080}
      # 화면이 부팅 때 읽는 API 주소 — 앞문이 `/config.json` 으로 내어 준다(4.1 §2.3 3단계).
      # compose 는 앞문 하나가 화면과 API 를 함께 서빙하므로 이 값은 자기 주소이고, 화면은
      # 결국 같은 오리진으로 돈다. **비워 두면 상대 경로로 돈다** — 그것도 맞는 동작이다.
      NERV_API_URL: ${NERV_API_URL:-http://localhost:8080}
    ports:
      # 컨테이너 안팎이 같은 포트다 — 층이 하나 줄었다(걷힌 이름 NERV_HTTP_PORT · REQ-CB-039).
      - "${NERV_WEB_PORT:-8080}:${NERV_WEB_PORT:-8080}"   # TLS 는 호스트 앞단(조직 LB·프록시)에서 종료
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  embedmodels:
