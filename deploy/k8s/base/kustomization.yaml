# NERV 운영 배포 base — 정본: docs/04-mvp/codebase.md §6.2
#
# Secret(nerv-secrets: DATABASE_URL · NERV_AUTH_SECRET · NERV_S3_ACCESS_KEY · NERV_S3_SECRET_KEY
#        · NERV_EMBED_API_KEY · NERV_GITHUB_WEBHOOK_SECRET)은 base 가 만들지 않는다 —
# 조직 표준 경로(SOPS·sealed-secrets 등)로 주입하고 이름만 계약한다.
# 키 여섯의 예시는 overlays/<env>/secret.example.yaml (적용 대상이 아닌 템플릿이다).
#
# embed/ 는 로컬(자가호스팅) 프로필 전용이라 base resources 에 넣지 않는다 —
# 자가호스팅 오버레이만 추가하고, 외부 제공자 프로필은 configmap 의 NERV_EMBED_URL 만 바꾼다(§5.2a).
#
# **web/ 도 같은 자리다**(2026-09-20 · 4.1 §2.3 4단계 확정). 화면과 API 가 호스트로 갈린
# 뒤로 base 는 **API 호스트만** 안다 — `ingress.yaml` 은 `api.` 이고, 화면의 `app.` 규칙과
# 웹 파드는 `web/` 한 덩어리로 갈라져 나갔다. CDN 배치는 그것을 더하지 않고(화면은 CDN 이
# 서빙한다), 자가호스팅 배치의 오버레이는 `resources` 에 `../../base/web` 을 더한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nerv
resources:
  - namespace.yaml
  - configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - worker/deployment.yaml
  - worker/pvc.yaml
  - valkey/deployment.yaml
  - valkey/service.yaml
  - migrate/job.yaml
  - backup/cronjob.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: nerv

# 백업 스크립트는 이미지에 굽지 않고 configMap 으로 넣는다 — 절차가 바뀌어도 이미지를
# 다시 빌드하지 않기 위해서다(백업은 앱 배포 주기에 묶이면 안 된다).
#
# backup/nerv-backup.sh 는 deploy/scripts/nerv-backup.sh 의 **바이트 사본**이다 —
# kustomize 의 file source 가 kustomization.yaml 상위로 나갈 수 없어 어쩔 수 없이 둘이고,
# CI 가 `diff` 로 동일성을 강제한다(갈라지면 운영 절차와 문서가 달라진다).
configMapGenerator:
  - name: nerv-backup-scripts
    files:
      - backup/nerv-backup.sh
    options:
      disableNameSuffixHash: true
