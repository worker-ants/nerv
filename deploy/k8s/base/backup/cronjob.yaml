# 일 1회 Postgres 백업 — codebase.md §6.5 (REQ-CB-019)
#
# **백업 대상은 Postgres 와 첨부 오브젝트다**(§6.5 · 2026-09-07 정정). 스펙 첨부는
# 재생성되지 않는데 이 잡은 `mc` 없는 이미지로 돌아 첨부를 **한 번도 백업한 적이 없었다** —
# 스크립트는 경고 한 줄을 남기고 계속했고, 그 줄을 읽는 사람은 없었다(REQ-CB-031).
# RPO 24h 는 파일럿 규모의 시작값이고(NFR-04 에서 수용), 실측 후 조정한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nerv-backup
spec:
  schedule: '17 18 * * *' # UTC — 한국 새벽 3시 17분. 정각을 피해 다른 잡과 겹치지 않게
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          initContainers:
            # `rclone` 을 심는다 — 백업용 이미지를 따로 빌드하지 않는 이유는 아래와 같다(백업이
            # 앱 배포 주기에 묶이면 안 된다). 태그를 고정하는 것은 백업이 조용히 바뀌지
            # 않게 하기 위해서다. 정적 바이너리라 아래 alpine 컨테이너에서 그대로 돈다.
            #
            # 2026-09-24 까지는 quay.io/minio/mc 였다. MinIO 가 공개 이미지를 거둬 그 태그를
            # 당길 수 없게 됐다 — 노드에 캐시가 없으면 이 잡은 ImagePullBackOff 로 멈추고, 그
            # 실패를 읽는 사람은 대개 없다. 이 바이너리가 운영 S3 자격증명을 다루므로 스토리지
            # 업체의 후속 이미지나 포크 대신 rclone 공식 이미지로 옮겼다(사람 결정).
            - name: rclone-tool
              image: rclone/rclone:1.75.1
              command: ['cp', '/usr/local/bin/rclone', '/tools/rclone']
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: backup
              # postgres 클라이언트만 필요하다 — 애플리케이션 이미지를 쓰지 않는 이유는
              # 백업이 앱 배포 주기에 묶이면 안 되기 때문이다.
              #
              # **메이저는 서버와 짝을 맞춘다.** `pg_dump` 는 자기보다 새 메이저의 서버를 거부한다
              # (`aborting because of server version mismatch`) — 클라이언트가 낮으면 이 잡은
              # 매일 실패하고, 그 실패를 읽는 사람은 대개 없다. 반대(클라이언트 ≥ 서버)는 허용되므로
              # 서버를 올리기 **전에** 이쪽을 올린다. 외부 Postgres 가 17 이어도 18 클라이언트로 뜬다.
              image: postgres:18-alpine
              command: ['/bin/sh', '/scripts/nerv-backup.sh']
              envFrom:
                # S3 엔드포인트·버킷은 설정에, 자격증명은 시크릿에 있다 — 둘 다 있어야
                # 첨부를 미러한다(없으면 스크립트가 종료 코드 2 로 말한다)
                - configMapRef: { name: nerv-config }
                - secretRef: { name: nerv-secrets }
              env:
                - name: NERV_BACKUP_DIR
                  value: /backups
                - name: PATH
                  value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
                - { name: backups, mountPath: /backups }
                - { name: tools, mountPath: /tools }
          volumes:
            - name: tools
              emptyDir: {}
            - name: scripts
              configMap:
                name: nerv-backup-scripts
                defaultMode: 0555
            - name: backups
              persistentVolumeClaim:
                claimName: nerv-backups
---
# 백업 볼륨 — 오브젝트 스토리지 업로드로 대체하는 환경에서는 오버레이에서 제거한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nerv-backups
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
