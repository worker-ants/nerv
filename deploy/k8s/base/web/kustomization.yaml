# 화면을 **파드로** 세우는 배치의 조각 — 자가호스팅(NFR-01)이 더한다 (4.1 §2.3 4단계)
#
# base resources 에 없는 이유는 배포 지형이 둘이기 때문이다.
#   - **CDN 배치**: 화면은 CDN 이 서빙한다. 이 조각을 더하지 않으면 웹 파드도 `app.`
#     Ingress 도 서지 않고, `/config.json` 은 CDN 에 놓는 정적 파일이다(4.2 §5.2d).
#   - **자가호스팅 배치**: 오버레이가 `resources` 에 `../../base/web` 을 더한다.
#     그러면 Deployment·Service·Ingress 셋이 함께 온다 — **셋은 한 덩어리다**:
#     파드만 더하고 Ingress 를 잊으면 화면이 뜨는데 아무도 닿지 못한다.
#
# **여기에 kustomization.yaml 이 있는 이유**는 kustomize 가 루트 밖의 *파일*은 거절하고
# *디렉터리*는 받기 때문이다 — 오버레이가 파일 셋을 하나씩 가리킬 수 없다.
#
# **`namespace` 를 여기서도 선언한다.** `base/kustomization.yaml` 의 `namespace: nerv` 는
# 그 kustomization 의 resources 에만 미치고, 오버레이가 `resources` 에 **따로 더한** 이
# 디렉터리는 그 범위 밖이다 — 빠뜨리면 셋이 네임스페이스 없이 렌더되고, `kubectl` 이
# 그것을 **호출한 쪽의 기본 네임스페이스**로 보낸다. 2026-09-20 실측: 배포 파이프라인의
# 에이전트 파드가 자기 네임스페이스로 `nerv-web` 을 보내 forbidden 으로 막혔다 —
# **거기 권한이 있었다면 막히지도 않고 엉뚱한 네임스페이스에 떴을 것이다.**
# 렌더는 성공하고 문법도 멀쩡하다(REQ-CB-046 이 이제 렌더 결과에서 이것을 센다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nerv
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
