apiVersion: apps/v1
kind: Deployment
metadata:
  name: nerv-web
  labels: { app: nerv-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nerv-web }
  template:
    metadata:
      labels: { app: nerv-web }
    spec:
      containers:
        - name: web
          image: nerv-web # nginx + Vite 산출물 (§6.1 Dockerfile.web)
          ports:
            # 앞문이 리슨하는 포트다 — ConfigMap 의 NERV_WEB_PORT 와 **같아야 한다**.
            # k8s 는 이 값을 설정에서 받을 수 없어(정적 필드) 어긋나면 전 트래픽이 죽는데
            # 롤아웃은 성공으로 보인다 — 대조는 check-env-table.mjs 가 한다(REQ-CB-038).
            - { containerPort: 8080, name: http }
          env:
            - name: NERV_WEB_PORT
              valueFrom:
                configMapKeyRef: { name: nerv-config, key: NERV_WEB_PORT }
            - { name: NERV_API_UPSTREAM, value: 'nerv-api:8080' }
            # /mcp Origin 1차 검증 기준 — 최종 강제는 앱 가드(REQ-CB-013).
            # 브라우저가 싣는 Origin 은 화면이 뜬 주소이므로 NERV_WEB_URL 이다(REQ-CB-036).
            - name: NERV_PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef: { name: nerv-config, key: NERV_WEB_URL }
            # 화면이 부팅 때 읽는 API 주소 — 앞문이 `/config.json` 으로 내어 준다
            # (4.1 §2.3 3단계 · apps/web/src/lib/config.ts). **한 호스트 배치에서는 자기
            # 주소이고 화면은 결국 같은 오리진으로 돈다** — 호스트를 가르는 4단계에서
            # 이 값만 `api.` 로 옮기면 화면이 그쪽을 부른다(번들은 그대로다).
            - name: NERV_API_URL
              valueFrom:
                configMapKeyRef: { name: nerv-config, key: NERV_API_URL }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
