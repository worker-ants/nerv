# 비밀이 아닌 설정 — 비밀은 nerv-secrets(별도 주입, §6.2)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nerv-config
data:
  # 리슨 포트 둘 — **바꾸려면 매니페스트의 containerPort 도 함께 바꾼다.** k8s 의
  # containerPort 는 정적 필드라 이 값을 참조할 수 없어서, 여기만 고치면 파드는 다른 포트로
  # 리슨하고 Service 는 옛 포트로 보낸다 — **전 트래픽이 죽는데 롤아웃은 성공으로 보인다.**
  # 어긋남은 CI 가 잡는다(check-env-table.mjs ⑨ · REQ-CB-038). 환경마다 바꿀 값이 아니다.
  #   NERV_API_PORT  → base/api/deployment.yaml 의 containerPort
  #   NERV_WEB_PORT  → base/web/deployment.yaml 의 containerPort (앞문의 listen)
  NERV_API_PORT: '8080'
  NERV_WEB_PORT: '8080'
  # 우리 주소는 둘이고 **호스트가 갈렸다**(§5.2 · REQ-CB-036 · 4.1 §2.3 4단계).
  # 이 두 값이 배치의 중심이다 — 하나를 바꾸면 셋이 함께 움직인다:
  #   ① 화면이 부팅 때 읽는 API 주소(`/config.json` · REQ-CB-044)
  #   ② CORS 허용 오리진과 better-auth 신뢰 목록(REQ-CB-041)
  #   ③ 플러그인 카탈로그가 배포하는 주소(4.4 §2.11)
  # **Ingress 의 호스트와 반드시 같아야 한다**(ingress.yaml · web/ingress.yaml) — 어긋나면
  # 쿠키가 닿지 않는 호스트로 서명되고 CORS 목록도 어긋난다. 게이트가 그 일치를 센다
  # (check-k8s-render.mjs · REQ-CB-046).
  # 걷힌 이름(NERV_PUBLIC_URL)이 남아 있고 이 둘이 비면 api·worker 가 기동을 거부한다.
  NERV_WEB_URL: 'https://app.nerv.example.com'
  NERV_API_URL: 'https://api.nerv.example.com'
  NERV_LOG_LEVEL: 'info'
  NERV_VALKEY_URL: 'redis://nerv-valkey:6379'
  # **비워 두는 것이 기본이다**(2026-09-14 · REQ-CB-040). 전에는 `http://nerv-minio:9000`
  # 이 적혀 있었는데 **그 Service 를 만드는 매니페스트가 base·오버레이 어디에도 없다** —
  # 그럴듯한 기본값이라 운영자는 배선이 끝난 줄 알고, 첨부는 런타임에 조용히 실패했다.
  # 비면 StorageService 가 첨부를 **끄고 기동 로그에 그 사실을 남긴다**(셋 중 하나만 비어도).
  # 조직의 S3(또는 MinIO 를 올리는 오버레이)의 주소를 적는다. 자격증명 둘은 nerv-secrets.
  NERV_S3_ENDPOINT: ''
  # 에이전트가 받는 presigned PUT 주소 — 클러스터 밖에서 열리는 주소여야 한다.
  # 내부 주소로 서명하면 개발자 장비의 에이전트가 그 호스트를 해소하지 못한다.
  # **Ingress 의 경로가 아니라 별도 호스트다**(REQ-CB-034): presigned PUT 은 SigV4 로 경로까지
  # 서명하므로 `/s3` 접두를 앞문에서 벗기면 서명이 깨지고, MinIO 는 접두 아래에서 S3 API 를
  # 서빙하지 않는다. 그 호스트의 Ingress/LB 는 조직 S3(또는 MinIO 오버레이) 쪽에서 낸다.
  NERV_S3_PUBLIC_ENDPOINT: 'https://s3.nerv.example.com'
  NERV_S3_BUCKET: 'nerv-blobs'
  NERV_S3_FORCE_PATH_STYLE: 'true'
  # 임베딩 제공자 프로필(§5.2a). **비워 두는 것이 기본이다**(REQ-CB-040) — `nerv-embed` 는
  # base resources 에 없으므로(자가호스팅 오버레이만 더한다) 그 주소를 기본값으로 두면
  # 없는 서비스를 가리킨다. 비면 임베딩이 꺼지고 검색은 렉시컬로 degrade 하며, 그 사실이
  # 기동 로그에 남는다. 자가호스팅이면 `http://nerv-embed/v1`, 외부 제공자면 그 base URL.
  NERV_EMBED_URL: ''
  NERV_EMBED_MODEL: 'bge-m3'
  # 절단이 필요한 모델(text-embedding-3-*)을 쓰는 오버레이에서 'true'(§5.2a · REQ-CB-033)
  NERV_EMBED_SEND_DIMENSIONS: 'false'
  # ── 손잡이 전량 — 비우면 코드 기본값이다(전표 §5.2) ─────────────────────
  # **여기 없으면 운영자는 그 손잡이의 존재를 모른다.** `envFrom` 이라 키를 더하면 듣지만,
  # 더할 수 있다는 사실 자체를 ConfigMap 이 보여 주지 않으면 발견할 길이 없다(2026-09-14).
  # S3 호환 서명의 리전 — MinIO 는 아무 값이나 받지만 실제 S3·R2 는 이 값으로 검증한다.
  NERV_S3_REGION: 'us-east-1'
  # SSE keep-alive 주기(ms) — **앞문의 유휴 타임아웃이 이 값보다 짧으면 스트림이 조용히
  # 끊긴다.** Ingress 의 proxy-read-timeout(3600s)과 함께 본다(§6.3 · REQ-CB-035).
  NERV_SSE_KEEPALIVE_MS: '25000'
  # 허용 오리진의 **추가분**이다(쉼표·공백·줄바꿈 구분) — 화면 주소(`NERV_WEB_URL`)는 이미
  # 목록에 있다(REQ-CB-041). CORS 와 better-auth 가 이 합집합 하나를 본다: 두 곳이 갈리면
  # 로그인은 되는데 그 다음 요청이 전부 막힌다. CSRF 방어선이라 기본은 비운다.
  NERV_TRUSTED_ORIGINS: ''
  # 세션 쿠키의 `Domain` — **비우는 것이 기본이다**(REQ-CB-042). 화면과 API 가 같은 등록
  # 도메인 아래의 서브도메인 둘이면 비운 채로 동작한다: 쿠키는 API 호스트가 내주고
  # 브라우저는 그 호스트로 도로 싣고, `SameSite=Lax` 는 오리진이 아니라 **사이트**를 본다.
  # 적는 것은 쿠키를 한 호스트보다 **넓게** 둘 때이고(같은 도메인 아래의 다른 화면이 같은
  # 세션을 써야 하는 배치), 그러면 그 도메인 아래 모든 호스트가 세션 쿠키를 받는다 —
  # 신뢰하지 않는 호스트를 그 아래 두지 않는다는 운영 약속이 함께 간다(4.1 §2.3).
  # 두 공개 주소의 공통 상위가 아닌 값이면 **api·worker 가 기동을 거부한다**(틀린 Domain 은
  # 브라우저가 조용히 버려서, 로그인은 200 인데 세션이 없는 상태로만 드러난다).
  NERV_COOKIE_DOMAIN: ''
  # 임베딩 요청 예산 둘 — 지연은 입력 개수가 아니라 총 문자 수를 따라간다(§5.2b).
  NERV_EMBED_TIMEOUT_MS: '30000'
  NERV_EMBED_BATCH_CHARS: '6000'
  # 임베딩 한 판의 상한과 일감이 있을 때의 주기 — 비싼 잡이 급한 잡을 굶기지 않게 한다.
  NERV_EMBED_PASS_MS: '20000'
  NERV_EMBED_EVERY_MS: '1000'
  # 잡 루프의 틱 해상도 — 잡이 1초 주기를 원해도 틱이 성기면 그 간격으로 발화한다.
  NERV_WORKER_TICK_MS: '1000'
  # md 미러 산출 위치 — nerv-mirror PVC 의 마운트 경로다(worker/pvc.yaml).
  # 비우면 미러를 만들지 않는다.
  NERV_EXPORT_DIR: '/mirror'
