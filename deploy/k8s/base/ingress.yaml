# WebSocket 은 /ws (socket.io 어댑터의 path 설정값 — 계약 정본 docs/04-mvp/api.md §3.1).
# /mcp Origin 검증의 최종 강제는 앱 가드(mcp-origin.guard.ts)다 — Ingress 스니펫 주입은
# 조직 보안 정책상 비활성인 클러스터가 많아 의존하지 않는다(REQ-CB-013).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nerv
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600' # WebSocket · SSE 유휴 연결 유지
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off' # SSE 스트림 버퍼링 금지 (REQ-CB-014)
    # 서버가 선언한 상한(`MAX_REQUEST_BODY_BYTES` = 16 MiB)과 맞춘다. 5m 이던 값은
    # 훅 페이로드를 기준으로 잡은 것인데 이 애노테이션은 Ingress 전체에 걸려
    # 임포트 배치(clemvion 실측 1.39 MB, 최악 15 MB)까지 함께 막았다(2026-08-23).
    # 훅만 더 좁히려면 별도 Ingress 가 필요하다 — 앱이 자기 상한을 따로 지킨다.
    nginx.ingress.kubernetes.io/proxy-body-size: '16m'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [nerv.example.com]
      secretName: nerv-tls
  rules:
    - host: nerv.example.com
      http:
        paths:
          - {
              path: /api,
              pathType: Prefix,
              backend: { service: { name: nerv-api, port: { name: http } } },
            }
          - {
              path: /mcp,
              pathType: Prefix,
              backend: { service: { name: nerv-api, port: { name: http } } },
            }
          - {
              path: /ingest,
              pathType: Prefix,
              backend: { service: { name: nerv-api, port: { name: http } } },
            }
          - {
              path: /ws,
              pathType: Prefix,
              backend: { service: { name: nerv-api, port: { name: http } } },
            }
          - {
              path: /sse,
              pathType: Prefix,
              backend: { service: { name: nerv-api, port: { name: http } } },
            }
          - {
              path: /,
              pathType: Prefix,
              backend: { service: { name: nerv-web, port: { name: http } } },
            }
