# md 미러 산출 볼륨 — export 잡이 쓴다(NERV_EXPORT_DIR · §6.2)
#
# **워커 replicas 는 1 고정이라 RWO 로 충분하다**(REQ-CB-011). 미러는 DB 에서 다시 만들 수
# 있는 **파생물**이므로 백업 대상이 아니다(§6.5) — nerv-backups 와 성질이 다르고, 그래서
# 볼륨을 따로 둔다. 이 PVC 가 없던 동안 NERV_EXPORT_DIR 은 어느 배치에도 없었고, 미러는
# 명세에 있으면서 어떤 배포에서도 산출되지 않았다(2026-09-14).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nerv-mirror
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
