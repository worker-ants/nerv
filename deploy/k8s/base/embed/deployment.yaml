# 로컬(자가호스팅) 임베딩 프로필 전용 — 정본: docs/04-mvp/codebase.md §5.2a · §6.2
#
# base/kustomization.yaml 의 resources 에 없다. 자가호스팅으로 운영하는 오버레이만
# 이 디렉터리를 resources 에 추가하고 configmap 의 NERV_EMBED_URL 을 http://nerv-embed/v1 로 둔다.
# 외부 제공자(LM Studio·OpenAI) 프로필은 이 리소스를 배포하지 않고 URL 만 외부로 바꾼다.
#
# **compose 와 같은 것을 띄운다**(2026-09-02 정정). compose 는 2026-08-23 에 TEI 에서
# ollama 로 갈아탔는데(TEI 가 arm64 이미지를 내지 않아 Apple Silicon 에서 기동조차 못 한다)
# 이 매니페스트만 TEI 로 남아 있었다 — 같은 스택을 두 곳이 다르게 말하면, 운영에서 도는
# 것과 개발자가 검증한 것이 다른 모델·다른 포트가 된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nerv-embed
  labels: { app: nerv-embed }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nerv-embed }
  template:
    metadata:
      labels: { app: nerv-embed }
    spec:
      containers:
        - name: embed
          image: ollama/ollama:latest # 운영은 버전 태그 고정
          # ollama 는 요청 시 모델을 자동으로 받지 않는다(실측: `model not found`).
          # 서버를 띄운 뒤 한 번 받아 두지 않으면 첫 검색이 조용히 렉시컬로 degrade 한다.
          command: ['/bin/sh', '-c']
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$NERV_EMBED_MODEL"
              wait
          env:
            - name: NERV_EMBED_MODEL # 1024 차원 (REQ-CB-021)
              valueFrom:
                configMapKeyRef: { name: nerv-config, key: NERV_EMBED_MODEL }
          ports:
            - { containerPort: 11434, name: http }
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
          readinessProbe:
            # **모델이 실제로 있을 때만** 준비됐다고 말한다 — 서버만 뜬 상태를 준비됐다고
            # 부르면 그 사이의 임베딩이 전부 조용히 실패한다(compose 헬스체크와 같은 판정).
            exec:
              command: ['/bin/sh', '-c', 'ollama list | grep -q "$NERV_EMBED_MODEL"']
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60 # 첫 기동은 모델(~1.2GB) 다운로드를 기다린다
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 4Gi }
      volumes:
        - name: models
          emptyDir: {} # 모델 가중치 캐시 — 재다운로드 가능하므로 백업 대상이 아니다(§6.5)
