# nerv-config 오버레이 패치 예시 — prod. 정본: docs/04-mvp/codebase.md §6.2
#
# ★ 이 파일은 적용 대상이 아니다. kustomization.yaml 의 patches 에 없으므로
#   `kubectl kustomize deploy/k8s/overlays/prod` 산출물에 섞이지 않는다.
#   **환경마다 반드시 다시 생각해야 하는 키**가 무엇인지 보여 주는 템플릿이다.
#
# 값의 전체 집합과 기본값은 base/configmap.yaml 이 갖고, 각 변수의 뜻·필수 여부는
# docs/04-mvp/codebase.md §5.2 전표가 정본이다. 비밀은 여기 두지 않는다 — secret.example.yaml.
#
# base/configmap.yaml 의 값이 이미 prod 를 기준으로 적혀 있어 이 오버레이는 현재
# configmap 을 패치하지 않는다. **그것은 base 가 prod 와 같다는 뜻이 아니라
# 자리표시자 호스트가 우연히 같다는 뜻이다** — 실제 배치에서는 아래를 전부 조직의
# 값으로 바꾼 패치를 kustomization.yaml 의 patches 에 등록한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nerv-config
data:
  # 리슨 포트 둘(NERV_API_PORT · NERV_WEB_PORT)은 **여기서 바꿀 값이 아니다** —
  # 환경마다 다를 이유가 없고, 바꾸려면 base 의 containerPort 도 함께 가야 한다(§6.2).

  # ── ① 환경마다 반드시 바꾼다 ──────────────────────────────────────────────
  # 우리 주소 둘(4.2 §5.2 · REQ-CB-036) — 경로 없는 오리진만 적는다.
  #   NERV_WEB_URL: 사람이 브라우저로 여는 주소. 스펙 딥링크가 이것으로 절대화된다
  #   NERV_API_URL: 세션 쿠키 baseURL · **플러그인 카탈로그가 배포하는 주소**(4.4 API §2.11)
  # ingress-api-host.yaml·ingress-web-host.yaml 의 host 와 어긋나면 로그인이 되지 않거나, 되더라도 에이전트가
  # 설치한 플러그인이 다른 서버를 가리킨다. **게이트가 그 일치를 센다**(check-k8s-render.mjs · REQ-CB-046).
  # 호스트는 둘이다(4.1 §2.3 4단계) — 화면은 `app.`, API 는 `api.` 다.
  NERV_WEB_URL: 'https://app.nerv.example.com'
  NERV_API_URL: 'https://api.nerv.example.com'
  # **CORS 는 따로 설정할 것이 없다**: 허용 오리진은 NERV_WEB_URL + 아래 추가분의
  # 합집합이고 better-auth 도 같은 목록을 본다(REQ-CB-041). 화면을 그 둘 밖에서도 띄운다면
  # 그 오리진만 추가분에 적는다 — 코드는 추측하지 않는다.
  # NERV_TRUSTED_ORIGINS: 'https://studio.nerv.example.com'
  # 세션 쿠키는 **비운 채로 선다** — 두 호스트가 같은 등록 도메인 아래라 SameSite=Lax 가
  # 그대로 맞는다(REQ-CB-042). 같은 도메인 아래의 다른 화면이 같은 세션을 써야 할 때만
  # 공통 상위를 적고, 그러면 그 아래 모든 호스트가 세션 쿠키를 받는다.
  # NERV_COOKIE_DOMAIN: 'nerv.example.com'

  # 클라이언트 주소(4.2 §5.5 · REQ-CB-055). **Cloudflare Tunnel 뒤라면** 헤더를 켠다 — 엣지가
  # 클라이언트 주소를 CF-Connecting-IP 에 싣고, ingress 가 X-Forwarded-For 를 덮어써도 이
  # 헤더는 지나간다. **켜기 전에** Ingress(와 api Service)에 인터넷이 직접 닿지 않는지 본다 —
  # 닿으면 누구나 이 헤더를 적어 보낼 수 있다. 파드 CIDR 이 사설 대역 밖이면 신뢰 프록시도 적는다.
  # NERV_CLIENT_IP_HEADER: 'cf-connecting-ip'
  # NERV_TRUSTED_PROXIES: '10.0.0.0/8, 100.64.0.0/10'

  # 서버가 S3 에 붙는 주소. 조직 S3 를 쓰면 그 엔드포인트로 바꾼다.
  # base 는 이 값을 **비워 둔다**(REQ-CB-040) — `nerv-minio` Service 를 만드는 매니페스트가
  # 없어서 그 주소를 기본값으로 두면 없는 서비스를 가리킨다. 비면 첨부가 꺼지고 기동
  # 로그가 그 사실을 남긴다. 조직의 S3(또는 MinIO 를 올리는 오버레이) 주소를 여기 적는다.
  NERV_S3_ENDPOINT: 'http://nerv-minio:9000'
  # 에이전트가 받는 presigned PUT 주소 — **클러스터 밖에서 열리는 별도 호스트**여야 한다.
  # Ingress 의 경로 접두(`/s3`)로는 안 된다: SigV4 가 경로까지 서명한다(REQ-CB-034).
  NERV_S3_PUBLIC_ENDPOINT: 'https://s3.nerv.example.com'
  NERV_S3_BUCKET: 'nerv-blobs'
  # 조직 S3(AWS 등)면 'false' — path-style 은 MinIO 호환을 위한 값이다.
  NERV_S3_FORCE_PATH_STYLE: 'true'
  # NERV_S3_REGION: 'us-east-1'

  # ── ② 임베딩 프로필로 정한다(§5.2a) ───────────────────────────────────────
  # 운영 기본은 외부 제공자다 — base/embed/ 를 resources 에서 제외하고 주소만 바꾼다.
  # base 는 이 값을 **비워 둔다**(REQ-CB-040) — 비면 임베딩이 꺼지고 검색은 렉시컬로
  # degrade 한다. 외부 제공자면 그 base URL 을 적는다 — SEND_DIMENSIONS 도 함께 본다.
  NERV_EMBED_URL: 'https://api.openai.com/v1'
  NERV_EMBED_MODEL: 'text-embedding-3-small'
  # **운영 OpenAI 배치는 이 값을 켜야 한다**(REQ-CB-033). 끄면 1536 차원이 돌아와
  # 오류 없이 전 배치가 거절되고 검색이 렉시컬로 degrade 한다 — 조용한 고장이다.
  NERV_EMBED_SEND_DIMENSIONS: 'true'
  # 빠른 제공자는 왕복을 줄인다.
  # NERV_EMBED_BATCH_CHARS: '12000'

  # ── ③ 필요할 때만 더한다(base 에 없는 키 — §5.2) ──────────────────────────
  # 앞문의 유휴 타임아웃이 이 값보다 짧으면 SSE 가 조용히 끊긴다(REQ-CB-035).
  # NERV_SSE_KEEPALIVE_MS: '25000'

  # ── ④ 메일(2026-09-22 · 접속 정보는 2026-09-24 부터 여섯 키다 · §5.2) ────
  # **스위치는 `NERV_MAIL_HOST` 다** — 비면 메일이 꺼지고 **가입 이메일 인증 강제도 함께
  # 꺼진다**(2026-09-22 사람 결정 "강제" 가 그 배치에서만 성립하지 않는다). 운영은 채우는
  # 것이 기본이다. 비밀인 것은 `NERV_MAIL_PASS` 하나이고 nerv-secrets 의 몫이다 — 호스트·
  # 포트·TLS·사용자를 여기 적어 두면 **어디로 보내는지가 설정에 드러난다.**
  NERV_MAIL_HOST: 'smtp.example.com'
  # 비우면 587(submission · STARTTLS). 암묵 TLS 릴레이면 465 다.
  NERV_MAIL_PORT: '465'
  # 비우면 위 포트에서 유도한다(465 면 'true') — 손으로 적는 것은 비표준 포트에서 암묵
  # TLS 를 받는 게이트웨이일 때뿐이다. 바꿔 적으면 연결이 걸린 채 타임아웃한다.
  # NERV_MAIL_SECURE: 'true'
  # 인증 두 키(USER·PASS)는 **한 벌이라 nerv-secrets 에 함께** 있다 — 여기 적지 않는다.
  # 보내는 사람 — 호스트를 적으면 **반드시 채운다**. 비우면 api·worker 가 기동을 거부한다:
  # 보내는 사람 없는 메일은 거절되거나 스팸함으로 간다.
  NERV_MAIL_FROM: 'NERV <no-reply@nerv.example.com>'
  # 사람이 답장할 주소 — no-reply 로만 두면 "이 메일 뭐죠" 가 갈 곳이 없다.
  NERV_MAIL_REPLY_TO: 'support@example.com'
  # **첫 배포는 'true' 로 두고 무엇이 나가는지 먼저 본다**(로그에 수신자와 제목만 남는다).
  # 확인이 끝나면 'false' 로 내린다 — 켜 둔 채로 두면 초대가 아웃박스에만 쌓인다.
  NERV_MAIL_DRY_RUN: 'false'
  # 비우면 호스트 유무를 따른다 — 운영은 메일이 있으므로 강제다. 명시하면 그 값이 이기고,
  # 'true' 인데 호스트가 비면 기동을 거부한다.
  # NERV_REQUIRE_EMAIL_VERIFICATION: 'true'
