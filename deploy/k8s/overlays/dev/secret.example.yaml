# nerv-secrets 예시 — dev 오버레이. 정본: docs/04-mvp/codebase.md §6.2
#
# ★ 이 파일은 적용 대상이 아니다. kustomization.yaml 의 resources 에 없으므로
#   `kubectl kustomize deploy/k8s/overlays/dev` 산출물에 절대 섞이지 않는다.
#   여기 적힌 값은 전부 자리표시자이고, 그대로 적용하면 서버는 기동하되
#   서명·인증·첨부가 조용히 틀린 상태가 된다 — 값을 채워 이 파일을 적용하지 말고,
#   조직 표준 경로(SOPS · sealed-secrets · External Secrets)로 같은 이름·같은 키의
#   Secret 을 만든다. base 가 Secret 을 만들지 않는 이유가 그것이다.
#
# base 의 api · worker · migrate 세 워크로드가 모두 `envFrom: secretRef: {name: nerv-secrets}`
# 로 이 이름을 계약한다 — 이름이나 키가 틀리면 파드는 CreateContainerConfigError 로 선다.
# 각 변수의 뜻·필수 여부는 docs/04-mvp/codebase.md §5.2 전표가 정본이다.
apiVersion: v1
kind: Secret
metadata:
  name: nerv-secrets
  namespace: nerv
type: Opaque
# data(base64) 가 아니라 stringData 를 쓴다 — 사람이 읽고 베끼는 템플릿이라서다.
stringData:
  # 운영 Postgres 는 클러스터 밖이다(§6.0) — 접속 정보는 이 한 줄이 전부다.
  DATABASE_URL: 'postgres://nerv:CHANGEME@db.dev.example.com:5432/nerv'

  # better-auth 세션 서명 키. `openssl rand -base64 32`
  # 바꾸면 살아 있는 세션이 전부 끊긴다.
  NERV_AUTH_SECRET: 'CHANGEME-openssl-rand-base64-32'

  # S3 자격증명. **앱이 읽는 것은 이 둘**이고 MINIO_ROOT_* 가 아니다(§5.2).
  # 주소(NERV_S3_ENDPOINT · NERV_S3_PUBLIC_ENDPOINT)는 비밀이 아니라 configmap 의 몫이다.
  # 셋 중 하나라도 비면 StorageService 가 클라이언트를 만들지 않아 첨부가 조용히 꺼진다.
  NERV_S3_ACCESS_KEY: 'CHANGEME'
  NERV_S3_SECRET_KEY: 'CHANGEME'

  # 외부 임베딩 제공자를 쓸 때만(§5.2a). 자가호스팅(nerv-embed) 프로필이면 이 키를 뺀다 —
  # 빈 문자열로 두면 `Authorization: Bearer ` 가 실려 제공자에 따라 401 이 된다.
  NERV_EMBED_API_KEY: 'CHANGEME'

  # GitHub 웹훅 서명 검증 키(EP-WHK-01). **비면 모든 배송이 401 로 거절된다** —
  # 웹훅을 안 쓰는 배치면 이 키를 뺀다.
  NERV_GITHUB_WEBHOOK_SECRET: 'CHANGEME'
