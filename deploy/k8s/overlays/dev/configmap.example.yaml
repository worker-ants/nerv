# nerv-config 오버레이 패치 예시 — dev. 정본: docs/04-mvp/codebase.md §6.2
#
# ★ 이 파일은 적용 대상이 아니다. kustomization.yaml 의 patches 에 없으므로
#   `kubectl kustomize deploy/k8s/overlays/dev` 산출물에 섞이지 않는다.
#   **환경마다 반드시 다시 생각해야 하는 키**가 무엇인지 보여 주는 템플릿이다 —
#   실제로 이 오버레이가 덮는 값은 configmap-host.yaml 에 있다.
#
# 값의 전체 집합과 기본값은 base/configmap.yaml 이 갖고, 각 변수의 뜻·필수 여부는
# docs/04-mvp/codebase.md §5.2 전표가 정본이다. 비밀은 여기 두지 않는다 — secret.example.yaml.
#
# base/configmap.yaml 의 값은 **prod 를 기준으로 적혀 있다.** 그래서 dev 는 최소한
# 아래 ①을 덮어야 하고, 덮지 않으면 파드는 정상으로 보이면서 틀린 주소로 동작한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nerv-config
data:
  # 리슨 포트 둘(NERV_API_PORT · NERV_WEB_PORT)은 **여기서 바꿀 값이 아니다** —
  # 환경마다 다를 이유가 없고, 바꾸려면 base 의 containerPort 도 함께 가야 한다(§6.2).

  # ── ① 환경마다 반드시 바꾼다 ──────────────────────────────────────────────
  # 우리 주소 둘(4.2 §5.2 · REQ-CB-036) — 경로 없는 오리진만 적는다.
  #   NERV_WEB_URL: 사람이 브라우저로 여는 주소. 스펙 딥링크가 이것으로 절대화된다
  #   NERV_API_URL: 세션 쿠키 baseURL · **플러그인 카탈로그가 배포하는 주소**(4.4 API §2.11)
  # ingress-api-host.yaml·ingress-web-host.yaml 의 host 와 어긋나면 로그인이 되지 않거나, 되더라도 에이전트가
  # 설치한 플러그인이 다른 서버를 가리킨다. **게이트가 그 일치를 센다**(check-k8s-render.mjs · REQ-CB-046).
  # 호스트는 둘이다(4.1 §2.3 4단계) — 화면은 `app.`, API 는 `api.` 다.
  NERV_WEB_URL: 'https://app.nerv.dev.example.com'
  NERV_API_URL: 'https://api.nerv.dev.example.com'
  # **CORS 는 따로 설정할 것이 없다**: 허용 오리진은 NERV_WEB_URL + 아래 추가분의
  # 합집합이고 better-auth 도 같은 목록을 본다(REQ-CB-041). 화면을 그 둘 밖에서도 띄운다면
  # 그 오리진만 추가분에 적는다 — 코드는 추측하지 않는다.
  # NERV_TRUSTED_ORIGINS: 'https://studio.nerv.dev.example.com'
  # 세션 쿠키는 **비운 채로 선다** — 두 호스트가 같은 등록 도메인 아래라 SameSite=Lax 가
  # 그대로 맞는다(REQ-CB-042). 같은 도메인 아래의 다른 화면이 같은 세션을 써야 할 때만
  # 공통 상위를 적고, 그러면 그 아래 모든 호스트가 세션 쿠키를 받는다.
  # NERV_COOKIE_DOMAIN: 'nerv.dev.example.com'

  # 서버가 S3 에 붙는 주소(클러스터 안).
  # base 는 이 값을 **비워 둔다**(REQ-CB-040) — `nerv-minio` Service 를 만드는 매니페스트가
  # 없어서 그 주소를 기본값으로 두면 없는 서비스를 가리킨다. 비면 첨부가 꺼지고 기동
  # 로그가 그 사실을 남긴다. 조직의 S3(또는 MinIO 를 올리는 오버레이) 주소를 여기 적는다.
  NERV_S3_ENDPOINT: 'http://nerv-minio:9000'
  # 에이전트가 받는 presigned PUT 주소 — **클러스터 밖에서 열리는 별도 호스트**여야 한다.
  # Ingress 의 경로 접두(`/s3`)로는 안 된다: SigV4 가 경로까지 서명한다(REQ-CB-034).
  # 이 둘은 **configmap-host.yaml 이 실제로 덮는다**(2026-09-14) — 덮지 않던 동안 dev 는
  # 운영 S3 호스트·운영 버킷을 쓰고 있었다.
  NERV_S3_PUBLIC_ENDPOINT: 'https://s3.nerv.dev.example.com'
  # 환경끼리 버킷을 공유하면 dev 가 운영 첨부를 덮는다 — 이름을 가른다.
  NERV_S3_BUCKET: 'nerv-blobs-dev'

  # ── ② 임베딩 프로필로 정한다(§5.2a) ───────────────────────────────────────
  # 자가호스팅이면 아래 그대로 두고 base/embed/ 를 resources 에 더한다.
  # 외부 제공자면 그 base URL 로 바꾸고 secret 의 NERV_EMBED_API_KEY 를 채운다.
  # base 는 이 값을 **비워 둔다**(REQ-CB-040) — 비면 임베딩이 꺼지고 검색은 렉시컬로
  # degrade 한다. 자가호스팅이면 embed/ 를 이 오버레이의 resources 에 더하고 그 Service 주소를 적는다.
  NERV_EMBED_URL: 'http://nerv-embed/v1'
  NERV_EMBED_MODEL: 'bge-m3'
  # text-embedding-3-* 처럼 절단이 필요한 모델을 쓸 때만 'true'(REQ-CB-033).
  # 게이트웨이 뒤의 같은 모델도 절단이 필요하다 — 주소로 추정하지 않는다.
  NERV_EMBED_SEND_DIMENSIONS: 'false'

  # ── ③ 필요할 때만 더한다(base 에 없는 키 — §5.2) ──────────────────────────
  # 앞문의 유휴 타임아웃이 이 값보다 짧으면 SSE 가 조용히 끊긴다(REQ-CB-035).
  # NERV_SSE_KEEPALIVE_MS: '25000'
  # dev 는 올려 둘 만하다 — 고른 수준과 그보다 심각한 것을 켠다.
  # NERV_LOG_LEVEL: 'debug'

  # ── ④ 메일(2026-09-22 · 접속 정보는 2026-09-24 부터 여섯 키다 · §5.2) ────
  # **스위치는 `NERV_MAIL_HOST` 다** — 비면 메일이 꺼지고 가입 이메일 인증 강제도 함께
  # 꺼진다. 비밀인 것은 `NERV_MAIL_PASS` 하나이고 nerv-secrets 의 몫이다.
  # **dev 가 진짜 사람에게 초대 메일을 보내지 않게 한다** — 버킷 이름을 가른 것과 같은
  # 이유다(위 ①). 둘 중 하나를 고른다:
  #   ⓐ 호스트를 비워 메일을 끈다 — 초대는 [복사] 경로로 전달한다(4.4 §1.6)
  #   ⓑ 호스트는 적고 DRY_RUN 을 'true' 로 — 아웃박스는 쌓이고 나가지는 않는다.
  #      로그에 수신자와 제목만 남아, 무엇이 나갈지 먼저 볼 수 있다
  # NERV_MAIL_HOST: 'smtp.dev.example.com'
  # 비우면 587. 읽을 수 없는 값이면 기동을 거부한다.
  # NERV_MAIL_PORT: '587'
  # 비우면 포트에서 유도한다(465 면 'true') — 여기를 손으로 적을 이유는 비표준 포트에서
  # 암묵 TLS 를 받는 게이트웨이뿐이다.
  # NERV_MAIL_SECURE: ''
  # 인증 두 키(USER·PASS)는 **한 벌이라 nerv-secrets 에 함께** 있다 — 여기 적지 않는다.
  # NERV_MAIL_DRY_RUN: 'true'
  # 보내는 사람 — 호스트를 적으면 **반드시 채운다**(비우면 기동을 거부한다).
  # 운영과 다른 도메인을 쓰면 받는 사람이 dev 메일임을 한눈에 안다.
  # NERV_MAIL_FROM: 'NERV (dev) <no-reply@nerv.dev.example.com>'
  # NERV_MAIL_REPLY_TO: 'nerv-dev@example.com'
